name: Submit Application to B12
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Verify secrets are set
        env:
          APPLICATION_NAME: ${{ secrets.APPLICATION_NAME }}
        run: |
          if [ -z "$APPLICATION_NAME" ]; then
            echo "Error: Repository secrets are not configured."
            echo "Please set APPLICATION_NAME, APPLICATION_EMAIL, APPLICATION_RESUME_LINK, and APPLICATION_SIGNING_SECRET in your repository settings."
            exit 1
          fi

      - name: Run submission script
        run: python submit.py
        env:
          APPLICATION_NAME: ${{ secrets.APPLICATION_NAME }}
          APPLICATION_EMAIL: ${{ secrets.APPLICATION_EMAIL }}
          APPLICATION_RESUME_LINK: ${{ secrets.APPLICATION_RESUME_LINK }}
          APPLICATION_SIGNING_SECRET: ${{ secrets.APPLICATION_SIGNING_SECRET }}

